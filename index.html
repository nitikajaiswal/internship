
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Inspiration | Quote Generator</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

        <header>
            <div class="sun-icon">✦</div>
            <h1>Daily Inspiration</h1>
            <p>A little inspiration for your beautiful day.</p>
        </header>

        <main class="quote-card">

            <div class="quote-icon">“</div>

            <div class="quote-content" id="quoteContent">
                <p id="quote">Loading your daily inspiration...</p>
                <h3 id="author"></h3>
            </div>

            <div class="buttons">
                <button id="newQuoteBtn">
                    <span>✦</span> New Quote
                </button>

                <button id="copyBtn" class="copy-btn">
                    Copy Quote
                </button>
            </div>

            <p class="footer-text">Take a breath. Believe in yourself. Keep growing.</p>

        </main>

        <footer>
            Made with ♡ for your daily motivation
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
